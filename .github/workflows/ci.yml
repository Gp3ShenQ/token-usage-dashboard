name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check on main: only this repository's dev branch may merge into it.
  source-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only dev may merge into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE" = "main" ] && { [ "$HEAD" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; }; then
            echo "::error::Only $GITHUB_REPOSITORY:dev may merge into main (got $HEAD_REPO:$HEAD)."
            exit 1
          fi
          echo "Source branch OK"

  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Preview next release
        run: node scripts/release-version.mjs
      - run: npm run typecheck
      - run: npm run build:main
      - run: npm run test:monitor

  package:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      # Each native command gets its own step so a failing exit code is never masked.
      - run: npx electron scripts/check-monitor-ui.cjs --packaged
      - run: npx electron scripts/check-handoff-records-ui.cjs --packaged
      - name: Smoke test packaged app
        run: ./scripts/smoke-packaged.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-usage-dashboard-portable
          path: release/token-usage-dashboard-portable.exe
          retention-days: 7
