name: Release

# Publishes a release when main carries a package.json version that has no tag yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: node scripts/check-version.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      # Each native command gets its own step so a failing exit code is never masked.
      - if: steps.version.outputs.exists == 'false'
        run: npm ci
      - if: steps.version.outputs.exists == 'false'
        run: npm run typecheck
      - if: steps.version.outputs.exists == 'false'
        run: npm run build:main
      - if: steps.version.outputs.exists == 'false'
        run: npm run test:monitor

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: npm run build

      - if: steps.version.outputs.exists == 'false'
        run: npx electron scripts/check-monitor-ui.cjs --packaged
      - if: steps.version.outputs.exists == 'false'
        run: npx electron scripts/check-handoff-records-ui.cjs --packaged
      - name: Smoke test packaged app
        if: steps.version.outputs.exists == 'false'
        run: ./scripts/smoke-packaged.ps1

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum token-usage-dashboard-portable.exe > token-usage-dashboard-portable.exe.sha256
          gh release create "${{ steps.version.outputs.tag }}" \
            token-usage-dashboard-portable.exe \
            token-usage-dashboard-portable.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes ${{ steps.version.outputs.prerelease }}
